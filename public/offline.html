<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're offline</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f6; --card:#ffffff; --text:#14201b; --muted:#5c6b64; --accent:#0e8a6b; --line:#dfe5e1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1512; --card:#141f1a; --text:#e8f1ec; --muted:#9bb0a6; --accent:#4ecda4; --line:#243229; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { width:100%; max-width:380px; padding:28px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:24px; }
  .icon { width:56px; height:56px; margin:0 auto 16px; display:grid; place-items:center; border-radius:16px; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); font-size:28px; }
  h1 { margin:0 0 8px; font-size:22px; }
  p { margin:0 0 20px; color:var(--muted); font-size:15px; }
  button { width:100%; padding:12px 16px; border:0; border-radius:14px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  small { display:block; margin-top:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">&#9889;</div>
  <h1>You're offline</h1>
  <p>This device has no internet connection right now. Nothing has been lost. Reconnect and the app will come back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small id="note">Waiting for your connection&hellip;</small>
</main>
<script>
  // As soon as the connection returns, load the app by itself.
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
